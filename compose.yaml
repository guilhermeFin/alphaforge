services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - alphaforge-data:/app/data
    ports:
      - "8000:8000"

  app:
    build: .
    command: streamlit run app/Home.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    env_file: .env
    environment:
      ALPHAFORGE_API: http://api:8000
    depends_on:
      - api
    volumes:
      - alphaforge-data:/app/data
    ports:
      - "8501:8501"

volumes:
  alphaforge-data:
