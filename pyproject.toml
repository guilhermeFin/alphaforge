[project]
name = "alphaforge"
version = "0.0.1"
description = "The research OS for emerging quant managers — an honest backtester that won't let you lie to yourself."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
vendors = ["simfin>=0.8", "nasdaq-data-link>=1.0"]  # paid PIT fundamental tiers (key-gated)
llm = ["anthropic>=0.40", "pydantic>=2"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.0"]  # leak-aware model ladder
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
app = ["streamlit>=1.33", "httpx>=0.27", "plotly>=5"]
dev = ["pytest>=7", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
