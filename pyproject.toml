[project]
name = "alphaforge"
version = "0.0.1"
description = "The research OS for emerging quant managers — an honest backtester that won't let you lie to yourself."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
vendors = ["simfin>=0.8", "nasdaq-data-link>=1.0"]  # paid PIT fundamental tiers (key-gated)
llm = ["anthropic>=0.40", "huggingface-hub>=0.27", "pydantic>=2"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.0"]  # leak-aware model ladder
econometrics = ["arch>=7.2", "ruptures>=1.1"]  # SPA/MCS, conditional volatility, point-in-time regime analysis
accounts = ["cryptography>=42"]  # field encryption + blind index for the data layer
# starlette/urllib3 floors are CVE-remediation pins (2026 advisories); see docs/security_gap_audit.md
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "starlette>=1.3.1"]
app = ["streamlit>=1.45", "httpx>=0.27", "plotly>=5", "urllib3>=2.7.0"]
dev = ["pytest>=7", "pytest-cov>=6", "httpx>=0.27", "urllib3>=2.7.0", "cryptography>=42"]
# The complete deterministic validation environment. It intentionally excludes
# live-data and paid-vendor adapters: tests must run without keys or network data.
test = [
    "pytest>=7",
    "pytest-cov>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "starlette>=1.3.1",
    "streamlit>=1.45",
    "httpx>=0.27",
    "plotly>=5",
    "urllib3>=2.7.0",
    "cryptography>=42",
    "anthropic>=0.40",
    "huggingface-hub>=0.27",
    "pydantic>=2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "arch>=7.2",
    "ruptures>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["api", "research", "app"]

[tool.coverage.report]
show_missing = true
omit = ["tests/*"]
