name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (SHA-pinned)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (SHA-pinned)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (engine + api + app + llm + ml + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,app,llm,ml,dev]"

      - name: Run the test suite
        run: pytest -q

      - name: Sanity-check the honest backtest end-to-end
        run: python examples/demo_momentum.py
