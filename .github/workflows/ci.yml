name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (SHA-pinned)

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0 (SHA-pinned)
        with:
          version: "0.11.27"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (SHA-pinned)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify locked research environment
        run: uv sync --locked --python ${{ matrix.python-version }} --extra test

      - name: Run the test suite
        run: uv run --locked --no-sync pytest -q

      - name: Report canonical branch coverage
        if: matrix.python-version == '3.11'
        run: |
          uv run --locked --no-sync pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=json
          uv run --locked --no-sync python scripts/check_coverage.py coverage.json

      - name: Sanity-check the honest backtest end-to-end
        run: uv run --locked --no-sync python examples/demo_momentum.py
